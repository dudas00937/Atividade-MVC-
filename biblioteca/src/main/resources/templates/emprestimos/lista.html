<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Empréstimos - Biblioteca</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<nav th:replace="~{fragments/menu :: menu}"></nav>

<main>
    <div class="topo">
        <h1>Empréstimos</h1>
        <a class="botao" th:href="@{/emprestimos/novo}">+ Cadastrar</a>
    </div>

    <table>
        <thead>
        <tr>
            <th>ID</th>
            <th>Livro</th>
            <th>Usuário</th>
            <th>Data de retirada</th>
            <th>Data de devolução</th>
            <th>Ações</th>
        </tr>
        </thead>
        <tbody>
        <tr th:if="${#lists.isEmpty(emprestimos)}">
            <td colspan="6">Nenhum registro cadastrado.</td>
        </tr>
        <tr th:each="item : ${emprestimos}">
            <td th:text="${item.id}"></td>
            <td th:text="${item.livro}"></td>
            <td th:text="${item.usuario}"></td>
            <td th:text="${#temporals.format(item.dataRetirada, 'dd/MM/yyyy')}"></td>
            <td th:text="${#temporals.format(item.dataDevolucao, 'dd/MM/yyyy')}"></td>
            <td class="acoes">
                <a class="botao pequeno" th:href="@{/emprestimos/editar/{id}(id=${item.id})}">Editar</a>
                <form th:action="@{/emprestimos/excluir/{id}(id=${item.id})}" method="post"
                      onsubmit="return confirm('Deseja realmente excluir?');">
                    <button type="submit" class="botao pequeno perigo">Excluir</button>
                </form>
            </td>
        </tr>
        </tbody>
    </table>
</main>
</body>
</html>
