<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Categoria - Biblioteca</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<nav th:replace="~{fragments/menu :: menu}"></nav>

<main>
    <h1 th:text="${categoria.id == null} ? 'Cadastrar Categoria' : 'Editar Categoria'"></h1>

    <form class="formulario" th:action="@{/categorias/salvar}" th:object="${categoria}" method="post">
        <input type="hidden" th:field="*{id}">

        <label for="genero">Gênero</label>
        <input type="text" id="genero" th:field="*{genero}" required>

        <div class="botoes">
            <button type="submit" class="botao">Salvar</button>
            <a class="botao secundario" th:href="@{/categorias}">Cancelar</a>
        </div>
    </form>
</main>
</body>
</html>
