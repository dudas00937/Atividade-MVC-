<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Categorias - Biblioteca</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<nav th:replace="~{fragments/menu :: menu}"></nav>

<main>
    <div class="topo">
        <h1>Categorias</h1>
        <a class="botao" th:href="@{/categorias/novo}">+ Cadastrar</a>
    </div>

    <table>
        <thead>
        <tr>
            <th>ID</th>
            <th>Gênero</th>
            <th>Ações</th>
        </tr>
        </thead>
        <tbody>
        <tr th:if="${#lists.isEmpty(categorias)}">
            <td colspan="3">Nenhum registro cadastrado.</td>
        </tr>
        <tr th:each="item : ${categorias}">
            <td th:text="${item.id}"></td>
            <td th:text="${item.genero}"></td>
            <td class="acoes">
                <a class="botao pequeno" th:href="@{/categorias/editar/{id}(id=${item.id})}">Editar</a>
                <form th:action="@{/categorias/excluir/{id}(id=${item.id})}" method="post"
                      onsubmit="return confirm('Deseja realmente excluir?');">
                    <button type="submit" class="botao pequeno perigo">Excluir</button>
                </form>
            </td>
        </tr>
        </tbody>
    </table>
</main>
</body>
</html>
